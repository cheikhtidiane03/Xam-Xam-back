services:
  postgres:
    image: postgres:16-alpine
    container_name: xaamxaam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: xaamxaam
      POSTGRES_USER: xaamxaam
      POSTGRES_PASSWORD: xaamxaam
    ports:
      - "5433:5432"
    volumes:
      - xaamxaam-pgdata:/var/lib/postgresql/data

volumes:
  xaamxaam-pgdata:
